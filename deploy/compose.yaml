# One server with Docker: DOMAIN=xblast.example.org docker compose -f deploy/compose.yaml up -d
# (the domain must point to the server, ports 80 and 443 open).
services:
  xblast:
    build: ..
    restart: unless-stopped
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
volumes:
  caddy-data:
