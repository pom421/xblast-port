[install]
# Exact versions in package.json (no ^): every upgrade is explicit.
exact = true

# Supply-chain cooldown: refuse any version published less than 7 days ago,
# giving the ecosystem time to spot a compromised package.
minimumReleaseAge = 604800

# Each package only sees the dependencies it declares (no phantom imports).
linker = "isolated"

# Dependency lifecycle scripts never run: "trustedDependencies" is empty in
# package.json, which also disables Bun's built-in list of trusted packages.
