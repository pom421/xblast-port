name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only GitHub token: CI has nothing to write.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # vp resolves Node and Bun from package.json (devEngines, packageManager):
      # same versions as on every developer machine.
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          version: 1.2.0
          run-install: false

      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp run -r test
      - run: vp run @xblast/client#build
